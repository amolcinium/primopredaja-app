<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Primopredaja — praćenje završnih radova</title>
<style>
  :root{ --navy:#1F3864; --blue:#2E5395; --green:#2e7d32; --greenbg:#d7f0d7;
    --red:#c62828; --redbg:#fde0e0; --orange:#e07b00; --orangebg:#ffe6c7;
    --grey:#888; --greybg:#eceff3; --line:#dde3ec; }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6fa;color:#1a2230;
    padding-bottom:70px;font-size:15px}
  header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10;
    display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header h1{font-size:16px;margin:0;font-weight:600;flex:1}
  header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:6px 10px;font-size:13px}
  .wrap{max-width:760px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .kpi .n{font-size:26px;font-weight:700;line-height:1.1} .kpi .l{font-size:12px;color:var(--grey);margin-top:3px}
  .bar{height:9px;background:var(--greybg);border-radius:6px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:var(--green)}
  .stan{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .stan:last-child{border-bottom:0}
  .stan .ozn{font-weight:700;width:54px} .stan .meta{flex:1;font-size:12px;color:var(--grey)}
  .stan .pct{font-weight:700;width:46px;text-align:right}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.ok{background:var(--greenbg);color:var(--green)} .pill.no{background:var(--redbg);color:var(--red)}
  .room{margin:16px 0 6px;font-weight:700;color:var(--navy);font-size:13px;text-transform:uppercase;letter-spacing:.3px}
  .item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff}
  .item .t{flex:1;font-size:14px} .item .s{width:74px;text-align:center;font-weight:700;border-radius:7px;padding:7px 0;font-size:13px}
  .s.OK{background:var(--greenbg);color:var(--green)} .s.X{background:var(--redbg);color:var(--red)}
  .s.DORADA{background:var(--orangebg);color:var(--orange)} .s.NP{background:var(--greybg);color:var(--grey)}
  .s.none{background:#fff;color:#bbb;border:1px dashed #ccc}
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    display:flex;z-index:10} .tabbar button{flex:1;border:0;background:none;padding:10px 0;font-size:12px;color:var(--grey)}
  .tabbar button.active{color:var(--blue);font-weight:700}
  .tabbar .ic{font-size:20px;display:block}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:50}
  .sheet{background:#fff;width:100%;max-width:760px;margin:0 auto;border-radius:16px 16px 0 0;padding:18px;max-height:88vh;overflow:auto}
  .sheet h3{margin:0 0 10px} .opt{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
  .opt button{padding:14px;border-radius:9px;border:2px solid var(--line);font-weight:700;font-size:15px;background:#fff}
  .pm{line-height:1.35} .pm small{display:block;font-weight:400;font-size:12px;color:var(--grey);margin-top:3px}
  .pm.active{border-color:var(--blue);background:var(--blue);color:#fff} .pm.active small{color:#dbe7ff}
  .opt button.OK{color:var(--green)} .opt button.X{color:var(--red)}
  .opt button.DORADA{color:var(--orange)} .opt button.NP{color:var(--grey)}
  label{font-size:12px;color:var(--grey);display:block;margin:10px 0 3px}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:13px;width:100%;font-size:16px;font-weight:600;margin-top:14px}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue);margin-top:8px}
  .dorada{border-left:4px solid var(--orange);padding:11px;border:1px solid var(--line);border-radius:9px;margin-bottom:9px;background:#fff}
  .dorada.crit{border-left-color:var(--red)} .dorada .top{display:flex;justify-content:space-between;font-size:12px;color:var(--grey)}
  .dorada .d{font-weight:600;margin:3px 0}
  .badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
  .login{max-width:340px;margin:14vh auto;text-align:center;padding:20px}
  .login .logo{font-size:42px} .muted{color:var(--grey);font-size:13px}
  .filterbar{display:flex;gap:7px;overflow:auto;padding-bottom:8px}
  .filterbar button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px}
  .filterbar button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .empty{text-align:center;color:var(--grey);padding:30px 10px}
  .rep{width:100%;border-collapse:collapse;font-size:13px}
  .rep th,.rep td{border:1px solid var(--line);padding:6px 8px;text-align:center}
  .rep th{background:var(--greybg)} .rep td:first-child,.rep th:first-child{text-align:left}
  .rep .hot{background:var(--redbg);color:var(--red);font-weight:700}
  .zapisnik{position:fixed;inset:0;background:#fff;z-index:100;overflow:auto}
  .znav{position:sticky;top:0;background:var(--navy);display:flex;gap:8px;padding:10px}
  .znav button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:8px 12px;font-size:14px}
  .znav .zsave{background:var(--blue)} .znav .zprint{background:var(--green);margin-left:auto}
  .zdoc{max-width:720px;margin:0 auto;padding:20px}
  .zdoc h2{text-align:center;font-size:18px} .zdoc h3{font-size:14px;margin-top:18px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .zt{width:100%;border-collapse:collapse;margin:10px 0} .zt td{border:1px solid var(--line);padding:6px;font-size:13px}
  .zt td:nth-child(odd){background:var(--greybg);font-size:12px;width:22%}
  .zrow{margin:10px 0} .zgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .zsig{display:flex;justify-content:space-around;margin-top:46px;text-align:center;font-size:13px}
  .ck{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:12px}
  .ck th,.ck td{border:1px solid #999;padding:5px 6px}
  .ck th{background:var(--greybg);font-size:11px}
  .ck td:nth-child(2),.ck td:nth-child(3),.ck td:nth-child(4),
  .ck th:nth-child(2),.ck th:nth-child(3),.ck th:nth-child(4){width:34px;text-align:center}
  .ck .cnp{width:30%} .ck td:nth-child(5){min-width:120px}
  .pgstan h2{text-align:center;font-size:16px;margin:0 0 6px}
  .pgstan h3{font-size:12px;margin:12px 0 2px;color:var(--navy);text-transform:uppercase}
  @media print{ body>*:not(#zapisnik){display:none!important} .noprint{display:none!important}
    .zapisnik{position:absolute} .zdoc input,.zdoc textarea{border:none;padding:0} }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
// ====== KONFIGURACIJA ======
// Ne moraš editovati ovaj fajl — URL i ključ se unose u app-u (ekran Podešavanje)
// i čuvaju u browseru (localStorage). Opciono: ubaci defaulte ovdje.
let CFG = JSON.parse(localStorage.getItem('pp_cfg') || 'null')
        || { url:"https://gnezqcfeqsmyatifpusp.supabase.co", anon:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduZXpxY2ZlcXNteWF0aWZwdXNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0Mzg2NjMsImV4cCI6MjA5NzAxNDY2M30.5lFPYqk5scZg5TysFI3wWhfHmV7cxH4YqOIV0Fq0NsM", email:"ekipa@primopredaja.local" };
let sb = (CFG.url && CFG.anon) ? supabase.createClient(CFG.url, CFG.anon) : null;
function SHARED_EMAIL(){ return CFG.email || "ekipa@primopredaja.local"; }
// ===========================
function rooms(){ // kategorije (prostorije) dinamički iz baze, redom po redoslijedu
  const ord={}, list=[];
  DATA.stavke.forEach(s=>{ if(!(s.prostorija in ord)){ ord[s.prostorija]=s.redoslijed; list.push(s.prostorija); } });
  return list.sort((a,b)=>ord[a]-ord[b]);
}
const OPEN_STAT = s => s!=='Provjereno OK' && s!=='Odustalo';
const app = document.getElementById('app');
let DATA = { stanovi:[], stavke:[], provjere:[], dorade:[], zgrada:{} };
let view = 'dashboard', curStan = null, doradaFilter = 'open', stanFilter = 'all';
let _rt=false, _rtTimer=null;

// ---------- AUTH ----------
async function init(){
  if(!sb){ renderSetup(); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ renderLogin(); return; }
  await loadAll(); setupRealtime(); render();
}
function renderSetup(msg){
  app.innerHTML = `<div class="login card">
    <div class="logo">⚙️</div>
    <h2>Podešavanje</h2>
    <p class="muted">Jednom unesi podatke iz svog Supabase projekta (Settings → API).</p>
    <label style="text-align:left">Project URL</label>
    <input id="c_url" placeholder="https://xxxx.supabase.co" value="${CFG.url||''}">
    <label style="text-align:left">anon public ključ</label>
    <input id="c_anon" placeholder="eyJhbGci..." value="${CFG.anon||''}">
    <label style="text-align:left">Email naloga (pristup)</label>
    <input id="c_email" value="${CFG.email||'ekipa@primopredaja.local'}">
    ${msg?`<p style="color:var(--red);font-size:13px">${msg}</p>`:''}
    <button class="btn" onclick="saveCfg()">Sačuvaj i nastavi</button>
  </div>`;
}
function saveCfg(){
  const url=val('c_url'), anon=val('c_anon'), email=val('c_email')||'ekipa@primopredaja.local';
  if(!url||!anon){ renderSetup('URL i ključ su obavezni.'); return; }
  CFG={url,anon,email}; localStorage.setItem('pp_cfg',JSON.stringify(CFG));
  sb=supabase.createClient(url,anon); init();
}
function renderLogin(msg){
  app.innerHTML = `<div class="login card">
    <div class="logo">🏗️</div>
    <h2>Primopredaja</h2>
    <p class="muted">Praćenje završnih radova i dorada</p>
    <label style="text-align:left">Pristupni kod</label>
    <input id="code" type="password" placeholder="unesi kod" autocomplete="current-password">
    ${msg?`<p style="color:var(--red);font-size:13px">${msg}</p>`:''}
    <button class="btn" id="loginBtn">Uđi</button>
  </div>`;
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('code').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
}
async function doLogin(){
  const code = document.getElementById('code').value.trim();
  if(!code) return;
  const { error } = await sb.auth.signInWithPassword({ email:SHARED_EMAIL(), password:code });
  if(error){ renderLogin('Pogrešan kod.'); return; }
  await loadAll(); setupRealtime(); render();
}
async function logout(){ await sb.auth.signOut(); renderLogin(); }

// ---------- DATA ----------
async function loadAll(){
  const [st, sv, pr, dr, zg] = await Promise.all([
    sb.from('stanovi').select('*').order('redoslijed'),
    sb.from('stavke').select('*').order('redoslijed'),
    sb.from('provjere').select('stan_id,stavka_id,status,napomena'),
    sb.from('dorade').select('*').order('datum_prijave',{ascending:false}),
    sb.from('zgrade').select('*').limit(1),
  ]);
  DATA = { stanovi:st.data||[], stavke:sv.data||[], provjere:pr.data||[], dorade:dr.data||[], zgrada:(zg.data&&zg.data[0])||{} };
}
function provFor(stanId){
  const m={}; DATA.provjere.filter(p=>p.stan_id===stanId).forEach(p=>m[p.stavka_id]=p.status); return m;
}
function tipKod(stan){ return stan&&stan.tip_grijanja==='Električno podno'?'el':stan&&stan.tip_grijanja==='Vodeno podno + kotao'?'vod':null; }
function applicableStavke(stan){ const k=tipKod(stan);
  return DATA.stavke.filter(s=>{ const p=s.primjenjivost||'sve'; return p==='sve' || !k || p===k; }); }
function stanStats(stanId){
  const s=DATA.stanovi.find(x=>x.id===stanId);
  const m=provFor(stanId); const list=applicableStavke(s); const tot=list.length;
  let ok=0,np=0,x=0,dor=0;
  list.forEach(it=>{ const v=m[it.id];
    if(v==='OK')ok++; else if(v==='N/P')np++; else if(v==='X')x++; else if(v==='DORADA')dor++; });
  const appl = tot-np;
  const pct = appl>0 ? Math.round(ok/appl*100) : 0;
  const openDor = DATA.dorade.filter(d=>d.stan_id===stanId && OPEN_STAT(d.status)).length;
  const ready = tot>0 && (ok+np===tot) && openDor===0;
  return { pct, x, dor, openDor, ready, checked: ok+np+x+dor };
}
function setupRealtime(){
  if(_rt||!sb) return; _rt=true;
  sb.channel('pp-rt').on('postgres_changes',{event:'*',schema:'public'},()=>scheduleRefresh()).subscribe();
}
function scheduleRefresh(){ clearTimeout(_rtTimer); _rtTimer=setTimeout(async()=>{
  if(document.querySelector('.modal')||document.getElementById('zapisnik')) return; // ne ometaj unos u toku
  await loadAll(); render();
},800); }

// ---------- RENDER ----------
function chrome(title, back){
  return `<header>
    ${back?`<button onclick="goBack()">‹ Nazad</button>`:''}
    <h1>${title}</h1>
    <button onclick="openAdmin()">⚙️</button>
    <button onclick="logout()">Izlaz</button>
  </header><div class="wrap" id="content"></div>` + tabbar();
}
function tabbar(){
  const T=[['dashboard','📊','Pregled'],['stanovi','🏢','Stanovi'],['dorade','🛠️','Dorade'],['izvodaci','👷','Izvođači']];
  return `<div class="tabbar">${T.map(([v,i,l])=>
    `<button class="${view===v&&!curStan?'active':''}" onclick="nav('${v}')"><span class="ic">${i}</span>${l}</button>`).join('')}</div>`;
}
function render(){
  if(curStan){ renderStan(); return; }
  if(view==='dashboard') renderDashboard();
  else if(view==='stanovi') renderStanovi();
  else if(view==='dorade') renderDorade();
  else renderIzvodaci();
}
function nav(v){ view=v; curStan=null; render(); }
function goBack(){ curStan=null; render(); }

function renderDashboard(){
  app.innerHTML = chrome('Pregled objekta', false);
  const c=document.getElementById('content');
  const stats = DATA.stanovi.map(s=>stanStats(s.id));
  const ukupno=DATA.stanovi.length;
  const spremni=stats.filter(s=>s.ready).length;
  const nije=stats.filter(s=>s.checked===0).length;
  const utoku=ukupno-spremni-nije;
  const avg = ukupno? Math.round(stats.reduce((a,s)=>a+s.pct,0)/ukupno):0;
  const odo = DATA.dorade.filter(d=>OPEN_STAT(d.status)).length;
  const crit = DATA.dorade.filter(d=>OPEN_STAT(d.status)&&d.prioritet==='Kritičan').length;
  const predato = DATA.stanovi.filter(s=>s.status_primopredaje==='Primopredato').length;
  const K=(n,l,col)=>`<div class="kpi"><div class="n" style="color:${col}">${n}</div><div class="l">${l}</div></div>`;
  c.innerHTML = `
    <div class="card"><div class="l" style="color:var(--grey);font-size:12px">UKUPNA ZAVRŠENOST OBJEKTA</div>
      <div style="font-size:34px;font-weight:800;color:var(--blue)">${avg}%</div>
      <div class="bar"><i style="width:${avg}%"></i></div></div>
    <div class="kpis">
      ${K(ukupno,'Ukupno stanova','var(--navy)')}
      ${K(spremni,'Spremni za primopredaju','var(--green)')}
      ${K(utoku,'U toku','var(--orange)')}
      ${K(nije,'Nije počelo','var(--grey)')}
      ${K(odo,'Otvorene dorade','var(--red)')}
      ${K(crit,'Kritične dorade','var(--red)')}
      ${K(predato,'Primopredato kupcu','var(--green)')}
      ${K(DATA.dorade.length,'Dorada ukupno','var(--navy)')}
    </div>`;
}

function renderStanovi(){
  app.innerHTML = chrome('Stanovi', false);
  const c=document.getElementById('content');
  const sprat=[...new Set(DATA.stanovi.map(s=>s.sprat).filter(Boolean))].sort();
  let list=DATA.stanovi.map(s=>({s,st:stanStats(s.id)}));
  if(stanFilter==='nije') list=list.filter(o=>!o.st.ready);
  else if(stanFilter==='ned') list=list.filter(o=>o.st.openDor>0);
  else if(stanFilter==='spreman') list=list.filter(o=>o.st.ready);
  else if(stanFilter.startsWith('sprat:')){ const f=stanFilter.slice(6); list=list.filter(o=>String(o.s.sprat)===f); }
  const F=(k,l)=>`<button class="${stanFilter===k?'active':''}" onclick="setStanFilter('${k}')">${l}</button>`;
  let html=`<div class="filterbar">${F('all','Svi')}${F('nije','Nije spreman')}${F('ned','Nedostaci')}${F('spreman','Spremni')}${sprat.map(sp=>F('sprat:'+sp,'Sprat '+sp)).join('')}</div>`;
  html+=`<div style="margin:0 0 10px"><button class="badge" style="background:var(--navy);color:#fff;padding:9px 14px" onclick="openPrintDialog('all')">🖨️ Štampaj checkliste — izbor stanova (${DATA.stanovi.length})</button></div>`;
  html+=`<div class="card">${list.map(({s,st})=>`<div class="stan" onclick="openStan('${s.id}')">
      <div class="ozn">${s.oznaka}</div>
      <div class="meta">${s.sprat?('Sprat '+s.sprat):'—'} · ${s.kvadratura?s.kvadratura+' m²':'—'}
        ${st.openDor?` · <span style="color:var(--red)">🛠️ ${st.openDor}</span>`:''}</div>
      <div class="pct" style="color:${st.pct===100?'var(--green)':'var(--navy)'}">${st.pct}%</div>
      <span class="pill ${st.ready?'ok':'no'}">${st.ready?'Spreman':'—'}</span>
    </div>`).join('')||'<div class="empty">Nema stanova u ovom filteru.</div>'}</div>`;
  c.innerHTML=html;
}
function setStanFilter(k){ stanFilter=k; renderStanovi(); }
function renderIzvodaci(){
  app.innerHTML = chrome('Izvođači', false);
  const c=document.getElementById('content');
  const today=new Date().toISOString().slice(0,10); const map={};
  DATA.dorade.forEach(d=>{ const k=d.izvodjac||'(nedodijeljeno)';
    const o=map[k]||(map[k]={izv:k,open:0,late:0,closed:0,days:[]});
    if(OPEN_STAT(d.status)){ o.open++; if(d.rok&&d.rok<today) o.late++; }
    if(d.status==='Provjereno OK'){ o.closed++;
      if(d.datum_prijave&&d.datum_zatvaranja) o.days.push((new Date(d.datum_zatvaranja)-new Date(d.datum_prijave))/86400000); }
  });
  const rows=Object.values(map).sort((a,b)=>b.open-a.open);
  if(!rows.length){ c.innerHTML='<div class="empty">Još nema evidentiranih dorada / izvođača.</div>'; return; }
  c.innerHTML=`<div class="card"><table class="rep">
    <tr><th>Izvođač</th><th>Otvor.</th><th>Probij. rok</th><th>Zatvor.</th><th>Pros. dana</th></tr>
    ${rows.map(o=>`<tr><td>${o.izv}</td>
      <td class="${o.open?'hot':''}">${o.open}</td>
      <td class="${o.late?'hot':''}">${o.late}</td>
      <td>${o.closed}</td>
      <td>${o.days.length?(o.days.reduce((a,b)=>a+b,0)/o.days.length).toFixed(1):'—'}</td></tr>`).join('')}
  </table></div>`;
}

function openStan(id){ curStan=DATA.stanovi.find(s=>s.id===id); render(); }
function renderStan(){
  const s=curStan, m=provFor(s.id), st=stanStats(s.id);
  app.innerHTML = chrome(s.oznaka, true);
  const c=document.getElementById('content');
  const open = DATA.dorade.filter(d=>d.stan_id===s.id && OPEN_STAT(d.status));
  let html = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><b style="font-size:18px">${st.pct}%</b> završeno
        <span class="pill ${st.ready?'ok':'no'}" style="margin-left:6px">${st.ready?'Spreman':'Nije spreman'}</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        <button class="badge" style="background:var(--greybg)" onclick="editStan('${s.id}')">⚙️ Podaci</button>
        <button class="badge" style="background:var(--navy);color:#fff" onclick="openPrintDialog('${s.id}')">🖨️ Checklista</button>
        <button class="badge" style="background:var(--blue);color:#fff" onclick="renderZapisnik('${s.id}')">📄 Zapisnik</button>
      </div>
    </div>
    <div class="bar" style="margin-top:8px"><i style="width:${st.pct}%"></i></div>
    <div class="muted" style="margin-top:6px">Tip grijanja: <b>${s.tip_grijanja||'nije postavljen'}</b>

function pmSet(mode){ window._pmMode=mode;
  document.getElementById('pm_blank').classList.toggle('active',mode==='blank');
  document.getElementById('pm_data').classList.toggle('active',mode==='data'); }
function pmAll(v){ document.querySelectorAll('.pmck').forEach(c=>c.checked=v); }
function pmFloor(sp){ document.querySelectorAll('.pmck').forEach(c=>{ if(c.dataset.sprat===(''+sp)) c.checked=true; }); }
function doPrintChecklist(){
  const ids=[...document.querySelectorAll('.pmck:checked')].map(c=>+c.value);
  if(!ids.length){ alert('Izaberi bar jedan stan.'); return; }
  const mode=window._pmMode||'blank';
  closeModal();
  printChecklist(ids,mode);
}
function printChecklist(ids,mode){
  mode=mode||'blank';
  const stans = ids.map(id=>DATA.stanovi.find(s=>s.id===id)).filter(Boolean);
  // za 'data' režim: mapa stavka_id -> {status, napomena} po stanu
  const fill=(st)=>{ // vraća [ok, ne, np] ćelije
    if(st==='OK') return ['✓','',''];
    if(st==='X') return ['','✗',''];
    if(st==='DORADA') return ['','🛠','']; // dorada = nije u redu, u toku
    if(st==='N/P') return ['','','✓'];
    return ['','',''];
  };
  let body='';
  stans.forEach((s,idx)=>{
    const appl=applicableStavke(s);
    const rs=[...new Set(appl.map(x=>x.prostorija))];
    let pmap={};
    if(mode==='data') DATA.provjere.filter(p=>p.stan_id===s.id).forEach(p=>pmap[p.stavka_id]={s:p.status,n:p.napomena});
    body+=`<div class="pgstan" style="${idx<stans.length-1?'page-break-after:always':''}">
      <h2>CHECKLISTA ZAVRŠNIH RADOVA${mode==='data'?' — STANJE':''}</h2>
      <table class="zt">
        <tr><td>Zgrada</td><td>${DATA.zgrada.naziv||''}</td><td>Stan</td><td><b>${s.oznaka}</b></td></tr>
        <tr><td>Sprat</td><td>${s.sprat||'—'}</td><td>Tip grijanja</td><td>${s.tip_grijanja||'—'}</td></tr>
        <tr><td>Datum</td><td>______________</td><td>Pregledao</td><td>______________</td></tr>
      </table>`;
    rs.forEach(room=>{
      const items=appl.filter(x=>x.prostorija===room);
      body+=`<h3>${room}</h3><table class="ck"><tr><th class="cna">Stavka</th><th>OK</th><th>NE</th><th>N/P</th><th class="cnp">Napomena</th></tr>
        ${items.map(it=>{ const pm=pmap[it.id]||{}; const c=mode==='data'?fill(pm.s):['','',''];
          return `<tr><td>${it.naziv}</td><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${mode==='data'?(pm.n||''):''}</td></tr>`; }).join('')}</table>`;
    });
    body+=`<div class="zsig"><div>Radnik (potpis)<br><br>__________________</div><div>Datum<br><br>__________________</div></div></div>`;
  });
  const ov=document.createElement('div'); ov.id='zapisnik'; ov.className='zapisnik';
  ov.innerHTML=`<div class="znav noprint">
     <button onclick="closeZapisnik()">‹ Zatvori</button>
     <button class="zprint" onclick="window.print()">🖨️ Štampaj / Sačuvaj PDF</button>
   </div><div class="zdoc">${body}</div>`;
  document.body.appendChild(ov);
}

function renderDorade(){
  app.innerHTML = chrome('Dorade', false);
  const c=document.getElementById('content');
  const stanOzn=id=>{ const s=DATA.stanovi.find(x=>x.id===id); return s?s.oznaka:'?'; };
  let list=DATA.dorade.slice();
  if(doradaFilter==='open') list=list.filter(d=>OPEN_STAT(d.status));
  else if(doradaFilter==='crit') list=list.filter(d=>OPEN_STAT(d.status)&&d.prioritet==='Kritičan');
  else if(doradaFilter==='late') list=list.filter(d=>OPEN_STAT(d.status)&&d.rok&&d.rok<new Date().toISOString().slice(0,10));
  const F=(k,l)=>`<button class="${doradaFilter===k?'active':''}" onclick="setFilter('${k}')">${l}</button>`;
  let html=`<div class="filterbar">${F('open','Otvorene')}${F('crit','Kritične')}${F('late','Probijen rok')}${F('all','Sve')}</div>`;
  if(!list.length) html+=`<div class="empty">Nema dorada u ovom filteru. 🎉</div>`;
  list.forEach(d=>{
    const late=d.rok&&OPEN_STAT(d.status)&&d.rok<new Date().toISOString().slice(0,10);
    const pcol=d.prioritet==='Kritičan'?'var(--red)':d.prioritet==='Visok'?'var(--orange)':'var(--grey)';
    html+=`<div class="dorada ${d.prioritet==='Kritičan'?'crit':''}" onclick="editDorada('${d.id}')">
      <div class="top"><span><b>${stanOzn(d.stan_id)}</b> · ${d.prostorija||''}</span>
        <span class="badge" style="background:${pcol};color:#fff">${d.prioritet}</span></div>
      <div class="d">${d.detalj||d.opis||'—'}</div>
      ${d.opis&&d.detalj?`<div class="muted">${d.opis}</div>`:''}
      <div class="muted" style="margin-top:4px">
        ${d.izvodjac?('👷 '+d.izvodjac+' · '):''}
        <span class="badge" style="background:var(--greybg)">${d.status}</span>
        ${d.rok?` · rok ${fmt(d.rok)}${late?' <b style="color:var(--red)">⚠ probijen</b>':''}`:''}</div>
    </div>`;
  });
  c.innerHTML=html;
}

  const { data }=sb.storage.from('fotografije').getPublicUrl(path);
  await sb.from('dorade').update({[field]:data.publicUrl}).eq('id',id);
  await loadAll(); alert('Slika sačuvana ✓');
}

    </div>
    <label>Dodaj stavku — upiši novu ILI postojeću kategoriju</label>
    <input id="new_pros" list="roomlist" placeholder="kategorija (npr. KUHINJA ili nova)">
    <datalist id="roomlist">${rooms().map(r=>`<option value="${r}">`).join('')}</datalist>
    <select id="new_prim" style="margin-top:6px">
      <option value="sve">važi za sve stanove</option>
      <option value="el">samo električno grijanje</option>
      <option value="vod">samo vodeno grijanje</option>
    </select>
    <div style="display:flex;gap:8px;margin-top:6px">
      <input id="new_stav" placeholder="naziv stavke / detalja za provjeru">
      <button class="badge" style="background:var(--green);color:#fff;padding:0 16px" onclick="addStavka()">+ Dodaj</button>
    </div>
    <hr style="margin:16px 0;border:none;border-top:1px solid var(--line)">
    <button class="btn ghost" onclick="closeModal();renderSetup()">🔑 Promijeni Supabase ključeve</button>
    <button class="btn ghost" onclick="closeModal()">Zatvori</button>
  </div>`;
  modal.onclick=e=>{ if(e.target===modal) closeModal(); };
  document.body.appendChild(modal);
}
async function saveZgrada(){
  if(!ZGRADA) return;
  await sb.from('zgrade').update({naziv:val('z_naziv')}).eq('id',ZGRADA.id);
  alert('Sačuvano ✓');
}
async function addStan(){
  const oznaka=val('new_ozn'); if(!oznaka||!ZGRADA) return;
  const red=(DATA.stanovi.length?Math.max(...DATA.stanovi.map(s=>s.redoslijed||0)):0)+1;
  const { error }=await sb.from('stanovi').insert({zgrada_id:ZGRADA.id,oznaka,redoslijed:red});
  if(error){ alert('Greška: '+error.message); return; }
  closeModal(); await loadAll(); openAdmin();
}
async function delStan(id,ozn){
  if(!confirm('Obrisati stan '+ozn+'? Briše i sve provjere i dorade za taj stan.')) return;
  const { error }=await sb.from('stanovi').delete().eq('id',id);
  if(error){ alert('Greška: '+error.message); return; }
  closeModal(); await loadAll(); openAdmin();
}
async function addStavka(){
  const pros=val('new_pros'), naziv=val('new_stav'); if(!pros||!naziv){ alert('Unesi kategoriju i naziv.'); return; }
  const prim=val('new_prim')||'sve';
  const nid=(DATA.stavke.length?Math.max(...DATA.stavke.map(s=>s.id)):0)+1;
  const inCat=DATA.stavke.filter(s=>s.prostorija===pros);
  const red=inCat.length ? Math.max(...inCat.map(s=>s.redoslijed))+1
                         : (DATA.stavke.length?Math.max(...DATA.stavke.map(s=>s.redoslijed)):0)+1;
  const { error }=await sb.from('stavke').insert({id:nid,prostorija:pros,naziv,redoslijed:red,primjenjivost:prim});
  if(error){ alert('Greška: '+error.message); return; }
  closeModal(); await loadAll(); openAdmin();
}
async function setPrimjenjivost(id,v){
  const { error }=await sb.from('stavke').update({primjenjivost:v}).eq('id',id);
  if(error){ alert('Greška: '+error.message); return; }
  await loadAll();
}
async function delStavka(id){
  if(!confirm('Obrisati ovu stavku iz checkliste SVIH stanova? Briše i njene provjere/dorade.')) return;
  await sb.from('dorade').delete().eq('stavka_id',id);
  await sb.from('provjere').delete().eq('stavka_id',id);
  const { error }=await sb.from('stavke').delete().eq('id',id);
  if(error){ alert('Greška: '+error.message); return; }
  closeModal(); await loadAll(); openAdmin();
}

init();
</script>
</body>
